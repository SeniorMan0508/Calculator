<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <section>
        <div>
            <input type="text" id="display">
        </div>
        <div>
            <table>
                <tr>
                    <td class="btn">X</td>
                    <td id="ac" class="btn">AC</td>
                    <td class="btn">%</td>
                    <td class="operator btn">/</td>
                </tr>

                <tr>
                    <td class="btn">7</td>
                    <td class="btn">8</td>
                    <td class="btn">9</td>
                    <td class="operator btn">*</td>
                </tr>

                <tr>
                    <td class="btn">4</td>
                    <td class="btn">5</td>
                    <td class="btn">6</td>
                    <td class="operator btn">-</td>
                </tr>

                <tr>
                    <td class="btn">1</td>
                    <td class="btn">2</td>
                    <td class="btn">3</td>
                    <td class="operator btn">+</td>
                </tr>

                <tr>
                    <td class="btn"><sup>x</sup> / <sub>-</sub></td>
                    <td class="btn">0</td>
                    <td class="btn">.</td>
                    <td class="operator btn">=</td>
                </tr>
            </table>
        </div>
    </section>
    
</body>
</html>
